seed: 42
# kaggle — trainLabels.csv + PNG; torchvision — всё качается в torchvision_data_root (~170 MB, удобно для Colab)
data_source: kaggle
data_root: ./cifar-10
torchvision_data_root: ./data/torchvision_cifar10
val_size: 5000
batch_size: 256
epochs: 300
lr: 0.001
weight_decay: 0.0005
optimizer: adamw
scheduler:
  name: cosine
  eta_min: 1.0e-6
  warmup_epochs: 10
early_stopping:
  patience: 40
  min_delta: 0.0005
  monitor: val_accuracy
checkpoint_dir: ./checkpoints
max_params: 1000000

# Ускорение загрузки (на Windows при ошибках multiprocessing поставьте 0)
num_workers: 0

training:
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  mixup_alpha: 0.1

mlflow:
  experiment_name: lab3-cifar10-mlp
  # file — пишет в ./mlruns (рекомендуется). UI: scripts/mlflow_server.ps1
  # http://127.0.0.1:5000 — только если сервер запущен тем же скриптом
  tracking_uri: file

# MLP-Mixer ~902k параметров (лимит 1M), только nn.Linear в mixing-блоках
model:
  type: mlp_mixer
  patch_size: 4
  dim: 128
  depth: 12
  token_mlp_dim: 64
  channel_mlp_dim: 256
  dropout: 0.1
  init_weights: true
  # type: mlp  # классический flatten-MLP (hidden_dims, activation, dropout)
  # hidden_dims: [288, 224, 144, 80]
  # activation: gelu

normalize:
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]
