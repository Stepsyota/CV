[project]
name = "cv-lab3"
version = "0.1.0"
description = "Lab 3: CIFAR-10 MLP with augmentations and MLflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=1.4.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.0",
]

[project.scripts]
lab3-train = "lab3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab3"]

[tool.hatch.build.targets.sdist]
include = ["src/lab3", "configs"]

[tool.uv]
package = true
